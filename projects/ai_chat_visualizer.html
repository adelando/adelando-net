<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI VISUALIZER V2.6 - Custom States</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --accent: #00fbff; --bg: #000000; --danger: #ff0000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* Central UI Labels */
        #ui-status { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 10; transition: opacity 0.8s; }
        .status-label { font-size: 0.6rem; letter-spacing: 4px; opacity: 0.4; text-transform: uppercase; margin-bottom: 8px; color: white; }
        .current-state { font-size: 1.2rem; font-weight: 300; color: var(--accent); text-transform: uppercase; letter-spacing: 8px; text-shadow: 0 0 20px var(--accent); }

        /* Offline Overlay */
        #offline-notice {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--danger); font-size: 3.5rem; font-weight: 600; letter-spacing: 10px;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.6); opacity: 0; pointer-events: none;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 20;
        }

        #debug-menu { position: absolute; top: 20px; left: 20px; background: rgba(10, 10, 15, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; backdrop-filter: blur(15px); display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 5px; }
        button { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.6rem; transition: 0.3s; }
        .active-btn { color: var(--accent) !important; border-color: var(--accent) !important; box-shadow: 0 0 10px rgba(0, 251, 255, 0.3); }
    </style>
</head>
<body>

    <div id="offline-notice">VORTEX<br>OFFLINE</div>

    <div id="debug-menu">
        <div class="btn-group">
            <button onclick="setState('idle')" id="btn-idle">IDLE</button>
            <button onclick="setState('listening')" id="btn-listening">LISTEN</button>
            <button onclick="setState('thinking')" id="btn-thinking">THINK</button>
            <button onclick="setState('talking')" id="btn-talking">TALK</button>
            <button onclick="setState('sleeping')" id="btn-sleeping">SLEEP</button>
            <button onclick="setState('offline')" id="btn-offline">OFFLINE</button>
        </div>
    </div>

    <div id="ui-status">
        <div class="status-label" id="custom-sub-label">VORTEX AI is...</div>
        <div id="state-display" class="current-state">STANDBY</div>
    </div>

    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer'), ctx = canvas.getContext('2d');
        let stars = [], currentState = 'idle', autoHue = 0;
        let dataArray = new Array(128).fill(0);
        
        // --- CUSTOM LABELS CONFIGURATION ---
        // You can change the displayed text here without breaking the AI triggers.
        const STATE_LABELS = {
            idle: "STANDBY",
            listening: "LISTENING TO YOU",
            thinking: "COMPUTING",
            talking: "SPEAKING",
            sleeping: "LOW POWER STATE",
            offline: "CONNECTION LOST"
        };

        const SETTINGS = {
            count: 220,
            baseRadius: 1.5,
            transitionSpeed: 0.05, // Slightly slower transition for weight
            idleBaseSpeed: 0.002,
            thinkSpeed: 0.012,
            listenRotation: -0.001,
            sleepSpeed: 0.0005,
            listenColor: { h: 170, s: 100, l: 50 },
            thinkColor: { h: 270, s: 100, l: 50 },
            sleepColor: { h: 210, s: 30, l: 30 },
            offlineColor: { h: 0, s: 100, l: 40 }
        };

        function setState(state) {
            currentState = state;
            document.getElementById('state-display').innerText = STATE_LABELS[state] || state;
            
            // Toggle UI Elements
            document.getElementById('offline-notice').style.opacity = (state === 'offline') ? "1" : "0";
            document.getElementById('ui-status').style.opacity = (state === 'offline') ? "0.1" : "1";

            document.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
            const activeBtn = document.getElementById(`btn-${state}`);
            if(activeBtn) activeBtn.classList.add('active-btn');
        }

        // Bridge to Python Backend
        try {
            const socket = io();
            socket.on('state_change', (data) => setState(data.state));
        } catch(e) {}

        function lerp(start, end, amt) { return start + (end - start) * amt; }

        function initStars() {
            stars = [];
            for(let i=0; i<SETTINGS.count; i++) {
                stars.push({
                    orbit: Math.random() * Math.PI * 2,
                    distance: (i / SETTINGS.count) * (window.innerWidth * 0.35) + 60,
                    speed: (Math.random() * 0.005 + 0.001),
                    size: Math.random() * SETTINGS.baseRadius + 0.5,
                    currentDist: 200,
                    currentSize: 1.5
                });
            }
        }

        function draw() {
            requestAnimationFrame(draw);
            autoHue += 0.4;
            let time = Date.now() * 0.001;
            
            for (let i = 0; i < dataArray.length; i++) {
                if (currentState === 'talking') {
                    let target = Math.abs(Math.sin(time * 8 + i * 0.1)) * 40 + (Math.random() * 15);
                    dataArray[i] = lerp(dataArray[i], target, 0.2);
                } else { dataArray[i] *= 0.88; }
            }
            
            ctx.fillStyle = (currentState === 'offline') ? 'black' : 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2, cy = canvas.height / 2;
            ctx.save();
            ctx.translate(cx, cy);

            stars.forEach((s, i) => {
                let targetDist, targetSize, targetColor;
                const intensity = dataArray[i % 64];

                switch(currentState) {
                    case 'idle':
                        s.orbit += SETTINGS.idleBaseSpeed * Math.sin(time * 0.25);
                        targetDist = s.distance + Math.sin(time * 0.4) * 12;
                        targetSize = s.size;
                        targetColor = `hsl(${(autoHue + i * 1.5) % 360}, 85%, 65%)`;
                        break;
                    case 'listening':
                        s.orbit += SETTINGS.listenRotation;
                        targetDist = (s.distance * 0.35) + Math.sin(time * 2 + i) * 4;
                        targetSize = s.size * 0.7;
                        targetColor = `hsl(${SETTINGS.listenColor.h}, ${SETTINGS.listenColor.s}%, ${SETTINGS.listenColor.l}%)`;
                        break;
                    case 'thinking':
                        s.orbit += SETTINGS.thinkSpeed;
                        targetDist = (s.distance * 0.4) + (i % 12);
                        targetSize = s.size * 1.1;
                        targetColor = `hsl(${SETTINGS.thinkColor.h}, ${SETTINGS.thinkColor.s}%, ${SETTINGS.thinkColor.l}%)`;
                        break;
                    case 'talking':
                        s.orbit += s.speed;
                        targetDist = s.distance + (intensity * 1.1);
                        targetSize = s.size + (intensity / 10);
                        targetColor = `hsl(${(autoHue + i * 1.5) % 360}, 85%, 65%)`;
                        break;
                    case 'sleeping':
                        s.orbit += SETTINGS.sleepSpeed;
                        targetDist = (s.distance * 0.25) + Math.sin(time * 0.2 + i) * 2;
                        targetSize = s.size * 0.5;
                        targetColor = `hsl(${SETTINGS.sleepColor.h}, ${SETTINGS.sleepColor.s}%, ${SETTINGS.sleepColor.l}%)`;
                        break;
                    case 'offline':
                        // MOON SPREAD UPDATED: Increased slightly as requested (0.3 instead of 0.15)
                        targetDist = (s.distance * 0.3) + (i % 15); 
                        targetSize = s.size * 0.45;
                        targetColor = `hsl(${SETTINGS.offlineColor.h}, ${SETTINGS.offlineColor.s}%, ${SETTINGS.offlineColor.l}%)`;
                        break;
                }

                s.currentDist = lerp(s.currentDist, targetDist, SETTINGS.transitionSpeed);
                s.currentSize = lerp(s.currentSize, targetSize, SETTINGS.transitionSpeed);

                const x = Math.cos(s.orbit) * s.currentDist;
                const y = Math.sin(s.orbit) * s.currentDist;

                ctx.fillStyle = targetColor;
                ctx.shadowColor = targetColor;
                ctx.shadowBlur = (currentState === 'offline') ? 15 : 2;
                ctx.beginPath();
                ctx.arc(x, y, Math.max(0.3, s.currentSize), 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initStars(); };
        window.onresize(); initStars(); setState('idle'); draw();
    </script>
</body>
</html>
